name: Comprobaciones de pull requests
on:
  pull_request:
permissions:
  contents: read
jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env:
          PUBLICATION_MODE: preview
      - run: npm run audit:dist
        env:
          PUBLICATION_MODE: preview
